name: CI

# Deployment is handled by Vercel's Git integration. This workflow only runs
# PR/branch checks (lint + build).

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Non-blocking: the repo has pre-existing lint findings.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
